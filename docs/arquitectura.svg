<text x="300" y="135" fill="#eb6834" font-size="8.5" font-weight="600">close(decoded)</text>
<text x="497" y="135" fill="#eb6834" font-size="8.5" font-weight="600">close(filtered)</text>
<text x="66" y="150" fill="#eb6834" font-size="8.5" font-weight="600">defer close(paths)</text>
<text x="16" y="182" fill="#52514e" font-size="8.5">Cota de memoria (contrapresión): imágenes en vuelo ≤ D + W + E + 2·buf · franjas: cada filtro puede dividir su imagen en k franjas (WaitGroup local)</text>
<!-- bottom legend -->
<g font-size="9">
 <rect x="4" y="200" width="244" height="58" rx="8" fill="#fff" stroke="#c9d3e3"/>
 <text x="14" y="216" font-weight="600" fill="#1d2b45">sync/atomic (sin candados)</text>
 <text x="14" y="230" fill="#52514e">listed, processed, busy[4] → Add</text>
 <text x="14" y="243" fill="#52514e">inFlight / maxIn → Add + CompareAndSwap</text>
 <rect x="258" y="200" width="244" height="58" rx="8" fill="#fff" stroke="#c9d3e3"/>
 <text x="268" y="216" font-weight="600" fill="#1d2b45">sync.Mutex (solo en la CLI)</text>
 <text x="268" y="230" fill="#52514e">protege el io.Writer de progreso que</text>
 <text x="268" y="243" fill="#52514e">E codificadores invocan vía OnResult</text>
 <rect x="512" y="200" width="244" height="58" rx="8" fill="#fff" stroke="#c9d3e3"/>
 <text x="522" y="216" font-weight="600" fill="#1d2b45">Cancelación</text>
 <text x="522" y="230" fill="#52514e">Ctrl+C / SIGTERM → signal.NotifyContext</text>
 <text x="522" y="243" fill="#52514e">-timeout → context.WithTimeout → errgroup</text>
</g>
</svg>
